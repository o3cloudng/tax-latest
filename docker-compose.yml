version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - tax_network
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  web:
    build:
      context: /opt/tax-latest
      dockerfile: Dockerfile
    container_name: web
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - /opt/tax-latest:/opt/tax-latest
      - static_volume:/opt/tax-latest/staticfiles
      - media_volume:/opt/tax-latest/media
    networks:
      - tax_network
    env_file:
      - .env.production
    depends_on:
      - redis
    command: gunicorn core.wsgi --bind 0.0.0.0:8000

  celery_worker:
    build:
      context: /opt/tax-latest
      dockerfile: Dockerfile
    container_name: celery_worker
    restart: unless-stopped
    volumes:
      - /opt/tax-latest:/opt/latest
    networks:
      - tax_network
    env_file:
      - .env.production
    depends_on:
      - redis
    command: celery -A core worker --loglevel=info --concurrency=4

  celery_beat:
    build:
      context: /opt/tax-latest
      dockerfile: Dockerfile
    container_name: celery_beat
    restart: unless-stopped
    volumes:
      - /opt/tax-latest:/opt/tax-latest
    networks:
      - tax_network
    env_file:
      - .env.production
    depends_on:
      - redis
      - celery_worker
    command: celery -A core beat --loglevel=info #--scheduler django_celery_beat.schedulers:DatabaseScheduler

  flower:
    build:
      context: /opt/tax-latest
      dockerfile: Dockerfile
    container_name: flower
    restart: unless-stopped
    volumes:
      - /opt/tax-latest:/opt/tax-latest
    networks:
      - tax_network
    env_file:
      - .env.production
    depends_on:
      - redis
      - celery_worker
      - celery_beat
    ports:
      - "5555:5555"
    command: celery -A core flower --broker=redis://redis:6379/0 --basic_auth=admin:1Million

volumes:
  redis_data:
  static_volume:
  media_volume:

networks:
  tax_network:
    driver: bridge
