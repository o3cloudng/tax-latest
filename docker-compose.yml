services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_web
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers=4 --threads=2 --timeout=120
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env.production
    depends_on:
      - redis
    networks:
      - tax_network
    ports:
      - "8000:8000"
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M   # 1GB limit
        reservations:
          memory: 512M    # guaranteed memory

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_worker
    command: celery -A core worker -l info --concurrency=4 --max-tasks-per-child=1000 --max-memory-per-child=200000
    volumes:
      - .:/app
    env_file:
      - .env.production
    depends_on:
      - redis
    networks:
      - tax_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 1024M   # worker allowed max 1GB
        reservations:
          memory: 512M

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celery_beat
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env.production
    depends_on:
      - redis
    networks:
      - tax_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M     # beat usually needs much less
        reservations:
          memory: 256M

  redis:
    image: redis:7
    container_name: redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - tax_network
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M     # Redis should have enough RAM to avoid eviction
        reservations:
          memory: 256M

volumes:
  redis_data:
  static_volume:
  media_volume:

networks:
  tax_network:
    driver: bridge
